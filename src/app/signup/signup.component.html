<div class="spacer"></div>
<div class="d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 56px);">
  <div class="card w-100" style="max-width: 400px;">
    <div class="card-body p-4">
      <div class="text-center">
        <img class="logo" src="assets/images/joinus.jpg" alt="join us">
      </div>
      <h3 class="form-heading text-center">Sign Up</h3>
      <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="signupName">Full Name</label>
          <input formControlName="name" type="text" class="form-control" id="signupName" placeholder="Enter your name">
          <div *ngIf="signupForm.get('name')?.invalid && signupForm.get('name')?.touched" class="error text-danger">
            <i class="fas fa-exclamation-circle"></i>  Name must be at least 3 characters long.
          </div>
        </div>
        <div class="form-group">
          <label for="signupEmail">Email address</label>
          <input formControlName="email" type="email" class=" form-control" id="signupEmail" placeholder="Enter email">
          <div  *ngIf="signupForm.get('email')?.invalid && signupForm.get('email')?.touched" class="error text-danger">
            <i class="fas fa-exclamation-circle"></i> Please enter a valid email.
          </div>
        </div>
        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input formControlName="password" type="password" class="form-control" id="signupPassword" placeholder="Password">
          <div *ngIf="signupForm.get('password')?.invalid && signupForm.get('password')?.touched" class="error text-danger">
            <i class="fas fa-exclamation-circle"></i> Password must be at least 6 characters long.
          </div>
        </div>
        <div class="form-group">
          <label for="signupConfirm">Confirm Password</label>
          <input formControlName="confirmPassword" type="password" class="form-control" id="signupConfirm" placeholder="Confirm Password">
          <div *ngIf="signupForm.get('confirmPassword')?.invalid && signupForm.get('confirmPassword')?.touched" class="error text-danger">
            <i class="fas fa-exclamation-circle"></i> Please confirm your password.
          </div>
        </div>
        <button type="submit" class="btn btn-gold btn-block" [disabled]="signupForm.invalid">Create Account</button>
      </form>
      <div class="text-center mt-3">
        <small>Already have an account? <a routerLink="/login">Sign In</a></small>
      </div>
    </div>
  </div>
</div>
