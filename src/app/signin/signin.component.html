
  
    <div class="d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 56px);">
      <div class="card w-100" style="max-width: 400px;">
        <div class="card-body p-4">
        <div class="text-center">
            <img class="" src="assets/images/welcomeback.png" alt="welcome">
        </div>
          <h3 class="form-heading text-center">Sign In</h3> 
          <form>
            <div class="form-group">
              <label for="signinEmail">Email address</label>
              <input type="email" class="form-control" id="signinEmail" placeholder="Enter email">
            </div>
            <div class="form-group">
              <label for="signinPassword">Password</label>
              <input type="password" class="form-control" id="signinPassword" placeholder="Password">
            </div>
            <button type="submit" class="btn btn-gold btn-block">Sign In</button>
          </form>
          <div class="text-center mt-3">
            <small>Don't have an account? <a routerLink="/signup">Sign Up</a></small>
          </div>
        </div>
      </div>
    </div>
